<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Un Kyu Lee</title>
    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>
    <header class="hero">
        <div class="hero__inner">
            <p class="eyebrow">TIMELINE</p>
            <h1>UN KYU LEE</h1>
            <p class="lede">
                A curated walk through the objects I've designed over the years. Tap any piece to explore its story,
                creation notes, and videos from the making process.
            </p>
        </div>
    </header>

    <main>
        <section
            class="gallery"
            id="gallery"
        >
            <div class="gallery__timeline-label">2024 → 2025</div>
            <div
                class="gallery__grid"
                id="galleryGrid"
            ></div>
        </section>
    </main>

    

    <section

        class="footer"

        id="contact"

    >

        <div>

            <p class="eyebrow">Contact</p>

            <p class="lede">

                <a

                    href="https://www.youtube.com/@unkyulee"

                    target="_blank"

                    rel="noopener"

                >YouTube - @unkyulee</a>

            </p>

            <p class="lede">

                <a

                    href="https://www.reddit.com/user/Background_Ad_1810/"

                    target="_blank"

                    rel="noopener"

                >Reddit - Background_Ad_1810</a>

            </p>

        </div>

    </section>



    <div
        class="modal"
        id="detailModal"
        aria-hidden="true"
    >
        <div
            class="modal__backdrop"
            data-close
        ></div>
        <div class="modal__content">
            <button
                class="modal__close"
                type="button"
                data-close
            >&times;</button>
            <img
                class="modal__image"
                id="modalImage"
                alt=""
            >
            <div class="modal__body">
                
                <p
                    class="modal__date"
                    id="modalDate"
                ></p>
                <h3 id="modalTitle"></h3>
                <p
                    class="modal__description"
                    id="modalDescription"
                ></p>
                <div class="modal__links">
                    <a
                        id="modalPage"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >Open project page</a>
                    <a
                        id="modalYoutube"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >Watch on YouTube</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pieces = [
            {
                title: 'The Clock Project',
                date: '2025-12-06',
                image: './image/clock.001.jpg',
                page: 'https://github.com/unkyulee/esp32-clock',
                youtube: null,
                description: 'A simple clock, born from a long detour through complex ideas and crowded technological experiments, now returns to its quiet purpose. After trying to fill every space with invention, it chooses instead to show only time, as if simplicity was the intention all along.'
            },
            {
                title: 'Rev.2.1 CyberDeck',
                date: '2025-11-11',
                image: './image/rev.2.1.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-2.1/readme.md',
                youtube: 'https://www.youtube.com/watch?v=-P8MK0iT04k',
                description: 'When all the computers and phones want to do everything and solve every problem, I find myself standing apart, refusing to claim any grand solution. I want only one: writing. So I ask whether a digital typewriter is even a reasonable thing to exist, a tool that rejects the noise in order to honor a single act. It becomes an attempt to find meaning in doing one activity at a time, a small resistance against the rush to become everything at once.'
            },
            {
                title: 'AlphaSmart Neo2 Desktop TypeWriter',
                date: '2025-09-26',
                image: './image/neo2.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-neo2/readme.md',
                youtube: 'https://www.youtube.com/watch?v=ckPTIjm1Qb4',
                description: 'AlphaSmart Neo2, a device long gone from the shelf, quietly survives in the hands of those who discover peace in technology from another time. Built more than a decade ago, it still works, still writes, still fills a void that the modern era has only deepened. Changing its outer dress becomes a way to place it back in the time where it belongs, while letting it continue forward, carrying a calm purpose that newer machines often forget.'
            },
            {
                title: 'Rev.4 Captain Hook',
                date: '2025-07-26',
                image: './image/rev.4.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-4-revamp/readme.md',
                youtube: 'https://www.youtube.com/watch?v=C-KRcLu5P9o',
                description: 'A decent mechanical keyboard, perhaps too designed for its own good, maybe even a little cringe, leaves me wondering what I have created. Does it make any sense at all from where you stand? If I say the small screen is a window to your mind, would you feel at ease letting your own thoughts watch you type, or would you rather imagine an authority looking over every word? What is most used is rarely the most appreciated, and this device seems to sit quietly in that truth, waiting for someone to notice what it tries to say.'
            },
            {
                title: 'Steam Deck Enclosure Mod',
                date: '2025-03-14',
                image: './image/steamdeck.001.webp',
                page: 'https://github.com/unkyulee/steamdeck-enclosure',
                youtube: null,
                description: '"jUsT uSE a laPToP!" they say, as if breaking a habit were as simple as choosing differently. Yet we all fall into one great habit without noticing, and fear arrives the moment a thin sense of reason breaks in front of your eyes. When everything is black and square, the circle becomes a quiet sin, a shape that does not fit the order it is placed in. So I wonder whether it is wrong to ask for a computer to be beautiful, or if the real sin is believing that beauty has no place in the machines we use every day.'
            },
            {
                title: 'Rev.7 Kindred Gift',
                date: '2025-01-30',
                image: './image/rev.7.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-7-e-ink/readme.md',
                youtube: 'https://youtu.be/lNPzFL1a6mI',
                description: 'Isn\'t e-ink an almost absurd technology, a digital paper trying to justify itself when pen and paper have always been enough? Yet it thrives on our attention and our expectations, as if we believe we can make the perfect paper by replacing it with circuits. Once that question appears, engineers lose sleep trying to re-invent the wheel, chasing a purity that may not exist. Has a paperlike display truly made your life easier, or does it only remind you of the typewriter you once felt pressing ink onto real paper?'
            },
            {
                title: 'Rev.2 Mother of Twins',
                date: '2024-09-17',
                image: './image/rev.2.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-2-revamp/readme.md',
                youtube: 'https://youtu.be/IFmGwKtGXtQ',
                description: 'Why can\'t we let go of the touch and the sense of volume we knew in childhood? Clamshell designs were once meant to guard themselves from messy, careless hands, yet now I stand before one as an adult and worry that my own fingers might get caught in it. Why do we insist on carrying technology everywhere, as if movement alone gives it purpose? Can\'t writing stay in one place, rooted and calm?'
            },
            {
                title: 'Rev.6 Vivian in New York',
                date: '2024-06-13',
                image: './image/rev.6.001.png',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-6-one-piece/readme.md',
                youtube: 'https://youtu.be/1ZP9wwYMaMY',
                description: 'Even if something works, if it cannot be held together, it feels like it means nothing. If a simple plastic bond can keep a keyboard and a screen in one place, should we call that teamwork or just another quiet experiment? Maybe the experiment is really about testing yet another love story between parts that are always trying to fit, trying to stay close. And so the history repeats, as it always does, with the same hope disguised in a different shape.'
            },
            {
                title: 'Rev.5 A Personal Journey',
                date: '2024-04-18',
                image: './image/rev.5.001.jpg',
                page: 'https://github.com/unkyulee/micro-journal/blob/main/micro-journal-rev-5-esp32-usbhost/readme.md',
                youtube: 'https://youtu.be/felg-JbUMr0',
                description: 'What is it about desire that makes a mechanical keyboard feel unfinished on its own? Is it the wish to be complete, or simply the wish to be useful? Among a hundred keys, there are no favorites to tease, no single one we remember pressing more than another, because those moments disappear as soon as they happen. Yet the USB port, stubborn as always, never fits on the first try, as if reminding us that completion is never as simple thing.'
            }
        ];

        const galleryGrid = document.getElementById('galleryGrid');
        const modal = document.getElementById('detailModal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalDate = document.getElementById('modalDate');
        const modalPage = document.getElementById('modalPage');
        const modalYoutube = document.getElementById('modalYoutube');
        const modalDescription = document.getElementById('modalDescription');

        const openModal = (piece) => {
            modalImage.src = piece.image;
            modalImage.alt = piece.title;
            modalTitle.textContent = piece.title;
            modalDescription.textContent = piece.description;
            modalDate.textContent = new Date(piece.date + 'T00:00:00').toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
            modalPage.href = piece.page;
            modalYoutube.style.display = piece.youtube ? 'inline-flex' : 'none';
            if (piece.youtube) {
                modalYoutube.href = piece.youtube;
            }
            modal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('lock-scroll');
        };

        const closeModal = () => {
            modal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('lock-scroll');
        };

        pieces.forEach((piece, index) => {
            const card = document.createElement('article');
            card.className = 'gallery__card';
            card.innerHTML = `
                <div class="gallery__image-wrap">
                    <img src="${piece.image}" alt="${piece.title}">
                    <span class="gallery__date">${piece.date}</span>
                    <span class="gallery__hint">Open</span>
                </div>
                <div class="gallery__meta">
                    <p class="gallery__index">#${String(index + 1).padStart(2, '0')}</p>
                    <h3>${piece.title}</h3>
                    <p class="gallery__cta">Tap for project links</p>
                </div>
            `;
            card.addEventListener('click', () => openModal(piece));
            galleryGrid.appendChild(card);
        });

        modal.addEventListener('click', (event) => {
            if (event.target.dataset.close !== undefined || event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>

</html>
