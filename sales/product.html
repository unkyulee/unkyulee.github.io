<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Micro Journal 제품의 옵션을 선택하고 웨이팅 리스트에 등록합니다.">
    <title>제품 보기 — Micro Journal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="markdown.js"></script>
    <script src="product.js" defer></script>
  </head>
  <body class="product-body">
    <main class="product-page">
      <a class="check-brand" href="index.html">← 제품 목록</a>
      <aside id="public-message" class="public-notice" aria-label="공지사항" hidden></aside>
      <div id="product-status" class="catalog-status" role="status">제품 정보를 불러오는 중입니다…</div>
      <article id="product-detail" class="product-detail" hidden>
        <section class="gallery" aria-label="제품 사진">
          <div class="gallery-stage"><img id="gallery-main" alt=""></div>
          <div id="gallery-thumbs" class="gallery-thumbs"></div>
        </section>
        <section class="configure">
          <p id="product-eyebrow" class="eyebrow">제품 옵션 선택</p>
          <h1 id="product-title"></h1>
          <p id="product-description" class="dialog-description"></p>

          <section id="waitlist-summary" class="waitlist-summary" hidden>
            <div><span>대기 순번</span><strong id="summary-queue"></strong></div>
            <div><span>상태</span><strong id="summary-status"></strong></div>
            <div><span>등록 시간</span><strong id="summary-created"></strong></div>
          </section>

          <form id="waitlist-form" method="post" target="registration-target">
            <input type="hidden" name="action" value="join">
            <input type="hidden" name="productId" id="product-id">
            <input type="hidden" name="selectedOptions" id="selected-options" value="{}">
            <div id="option-fields"></div>
            <div id="registration-fields">
              <div class="field-group">
                <label for="email">이메일 주소</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
              </div>
              <div class="honeypot" aria-hidden="true">
                <label for="website">웹사이트</label><input id="website" name="website" tabindex="-1" autocomplete="off">
              </div>
              <label class="consent"><input id="consent" type="checkbox" required> <span>웨이팅 리스트 운영을 위해 이메일 주소와 선택한 옵션을 저장하는 데 동의합니다.</span></label>
            </div>
            <div class="price-box">
              <span>예상 가격</span>
              <strong id="total-price">₩0</strong>
              <small id="rate-note"></small>
            </div>
            <button class="button button-primary submit-button" type="submit">웨이팅 리스트 등록</button>
            <p id="form-status" class="form-status" role="status"></p>
          </form>
          <iframe id="registration-target" name="registration-target" title="웨이팅 등록 처리" hidden></iframe>
        </section>
        <section id="product-full-description" class="markdown-body product-full-description" aria-label="제품 상세 설명" hidden></section>
      </article>
    </main>
  </body>
</html>
